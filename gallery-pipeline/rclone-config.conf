# rclone config for Cloudflare R2
# Place this in ~/.config/rclone/rclone.conf
#
# To set up:
# 1. Get your R2 credentials from Cloudflare Dashboard → R2 → Manage R2 API Tokens
# 2. Replace the placeholder values below
# 3. Test with: rclone ls r2:amyelectric-gallery

[amyelectric]
type = s3
provider = Cloudflare
access_key_id = YOUR_R2_ACCESS_KEY_ID
secret_access_key = YOUR_R2_SECRET_ACCESS_KEY
endpoint = https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
acl = public-read
bucket_policy = true

# Alternative: use r2: alias (recommended)
# This allows: rclone copy ./folder r2:amyelectric-gallery
[amyelectric]
type = s3
provider = Cloudflare
access_key_id = YOUR_R2_ACCESS_KEY_ID
secret_access_key = YOUR_R2_SECRET_ACCESS_KEY
endpoint = https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
acl = public-read
bucket_policy = true
