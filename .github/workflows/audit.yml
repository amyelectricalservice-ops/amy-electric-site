name: Website Quality & SEO Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    name: Run Site Audit & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Structured Data (JSON-LD Schemas)
        run: |
          python3 scripts/schema-tool.py validate

      - name: Verify CSS & JS Production Builds
        run: |
          python3 scripts/build-css.py
          python3 scripts/build-js.py
          git diff --exit-code css/style.min.css js/site.min.js || (echo "Minified CSS/JS out of sync! Run scripts/build-css.py and scripts/build-js.py" && exit 1)

      - name: Report Published Price Drift
        # Informational only: pages quote prices by hand, so they drift from
        # the estimate engine. Non-blocking on purpose — correcting copy is an
        # owner decision, not a build failure. Run --strict locally to gate.
        run: python3 scripts/audit-price-drift.py

      - name: Verify Sitemap Integrity
        run: |
          python3 <<'EOF'
          import xml.etree.ElementTree as ET
          import glob, re, sys

          tree = ET.parse('sitemap.xml')
          root = tree.getroot()
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          sitemap_urls = {elem.text.strip().replace('https://amyelectric.com/', '') or 'index'
                          for elem in root.findall('.//' + ns + 'loc')}

          def canon_path(f):
              try:
                  with open(f, encoding='utf-8', errors='replace') as fh:
                      head = fh.read(8000)
              except OSError:
                  return None
              m = re.search(r'<link rel="canonical" href="https://amyelectric\.com([^"]*)"', head)
              if not m:
                  return None
              p = m.group(1) or '/'
              return p.rstrip('/') or '/'

          html_files = glob.glob('*.html') + glob.glob('blog/*.html') + glob.glob('case-studies/*.html')
          html_urls = set()
          for f in html_files:
              if f == '404.html':
                  continue
              with open(f, encoding='utf-8', errors='replace') as fh:
                  head = fh.read(4000)
              if 'noindex' in head:
                  continue
              # canonical-elsewhere pages are aliases whose real canonical target is
              # the sitemap entry; they must not carry their own sitemap URL.
              clean = f.removesuffix('.html')
              own_path = '/' if clean == 'index' else '/' + clean
              if canon_path(f) is not None and canon_path(f) != own_path:
                  continue
              if clean == 'index':
                  url = 'index'
              elif clean.endswith('/index'):
                  url = clean.replace('/index', '/')
              else:
                  url = clean
              html_urls.add(url)

          errors = []
          missing_in_sitemap = html_urls - sitemap_urls
          if missing_in_sitemap:
              errors.append('Missing URLs in sitemap (%d): %s' % (len(missing_in_sitemap),
                                                                  sorted(missing_in_sitemap)))

          # Reverse assertion: every sitemap URL must map to a real, self-canonical
          # HTML file. A non-canonical sitemap entry undermines consolidation.
          html_set = set(html_files)
          for url in sorted(sitemap_urls):
              if url == 'index':
                  candidate = 'index.html'
              elif url.endswith('/'):
                  candidate = url + 'index.html'
              else:
                  candidate = url + '.html'
              if candidate not in html_set:
                  errors.append('Sitemap URL has no HTML file: %s' % url)
                  continue
              cp = canon_path(candidate)
              expected = '/' if url == 'index' else '/' + url.rstrip('/')
              if cp is None or cp != expected:
                  errors.append('Sitemap URL not self-canonical: %s (canonical=%s)' % (url, cp))

          if errors:
              for e in errors:
                  print('Error:', e)
              sys.exit(1)
          print('Sitemap integrity check passed!')
          EOF
