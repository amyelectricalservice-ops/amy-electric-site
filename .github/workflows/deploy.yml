name: Deploy Production

# Workers Builds is not connected to this repository, verified 2026-09-27: all 10
# deployments on record have source "wrangler" and none from Git. This workflow
# provides the automatic deploy instead. It requires two repository secrets,
# which are deliberately not in the repo:
#
#   CLOUDFLARE_API_TOKEN   API token with Account > Workers Scripts > Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the amyelectric.com zone
#
# The account id is taken from a secret rather than hardcoded, so no account id
# is committed, matching the convention in DEPLOYMENT-AMY-ELECTRIC.md.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate structured data and sitemap
        run: |
          python3 scripts/schema-tool.py validate
          python3 -c "
          import xml.etree.ElementTree as ET, glob, sys
          root = ET.parse('sitemap.xml').getroot()
          sm = {e.text.strip() for e in root.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')}
          hu = set()
          for f in glob.glob('*.html') + glob.glob('blog/*.html') + glob.glob('case-studies/*.html'):
              if f == '404.html':
                  continue
              if 'noindex' in open(f, encoding='utf-8', errors='replace').read(4000):
                  continue
              c = f.replace('./', '').removesuffix('.html')
              hu.add('https://amyelectric.com/' if c == 'index'
                     else 'https://amyelectric.com/' + c.replace('index', '') if c.endswith('/index')
                     else 'https://amyelectric.com/' + c)
          if hu != sm:
              print('sitemap mismatch:', hu ^ sm); sys.exit(1)
          print('sitemap OK:', len(sm), 'urls')
          "

  deploy:
    name: Deploy to Cloudflare Workers
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check required secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Automatic deploy is not armed. Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "Token needs the Account > Workers Scripts > Edit permission."
            exit 1
          fi

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Refresh sitemap lastmod for changed pages
        # Commits straight back with [skip ci] (skip-ci pushes start no new
        # runs, so this cannot loop). The working tree keeps the update so
        # the deploy below ships it. Never fails the deploy on push errors.
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/refresh-sitemap-lastmod.py || echo "lastmod refresh skipped"
          if ! git diff --quiet sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: refresh sitemap lastmod [skip ci]"
            git push origin HEAD:main || echo "WARNING: lastmod push failed; deploying without it"
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler whoami
          wrangler deploy --config wrangler.jsonc

      - name: Notify IndexNow
        # Only after a successful deploy: telling crawlers about a failed or
        # skipped deploy would be worse than staying silent.
        if: success()
        run: bash scripts/notify-indexnow.sh || echo "IndexNow notification failed; deploy still succeeded"

      - name: Verify the Worker is serving (bypasses the zone WAF)
        # Proves the deploy itself worked, independent of the edge. Bot Fight Mode
        # challenges GitHub's runner IPs on amyelectric.com, so a 200 there would be
        # luck and a 403 says nothing about the Worker. The workers.dev hostname runs
        # the same Worker on a domain the zone's WAF does not govern, so this is a
        # real check: it fails if the deploy broke the Worker.
        run: |
          fail=0
          for path in / /city-arleta /panel-upgrade /blog/ /sitemap.xml; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 \
              "https://amy-electric-site.a-m-y-electricalservice.workers.dev$path" || echo 000)
            echo "worker$path -> $code"
            [ "$code" = "200" ] || { echo "  FAILED: worker returned $code for $path"; fail=1; }
          done
          exit $fail

      - name: Verify the public domain is reachable
        # Separate concern: the Worker is proven above, this only reports edge state.
        # Bot Fight Mode answers runner IPs with a 403 Managed Challenge, which means
        # the edge is up and serving a challenge, not that the site is down. A 5xx or
        # a dead connection would be a real fault. Never relax the WAF to satisfy this.
        run: |
          for path in / /city-arleta /sitemap.xml; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36' \
              "https://amyelectric.com$path" || echo 000)
            echo "$path -> $code"
            case "$code" in
              200) ;;
              403) echo "  edge served a bot challenge (Bot Fight Mode) - expected from CI" ;;
              *) echo "  WARNING: $path returned $code" ;;
            esac
          done

      - name: Purge the edge cache
        # Deploying only replaces the Worker and the assets; it does not evict
        # what the edge already stored. _headers gives /css/* and /js/* a
        # one-year edge TTL, so without this a changed style.min.css or
        # site.min.js keeps being served from cache long after the deploy that
        # fixed it.
        #
        # Non-blocking on purpose: the token can read the zone but has no Cache
        # Purge permission, and a pipeline that is red on every run trains
        # people to ignore red — which would hide a real deploy failure. The
        # permission gap is raised as a warning instead, so the run stays green
        # for a deploy that actually worked.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_id=$(curl -sS --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=amyelectric.com" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "zone: $zone_id"
          resp=$(curl -sS --retry 3 --retry-delay 2 -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache")
          echo "$resp"
          if ! echo "$resp" | python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          if not data.get('success'):
            msg = data.get('errors', [{}])[0].get('message', 'unknown error')
            sys.exit('cache purge rejected: ' + msg)
          print('edge cache purged')
          "; then
            echo "::warning title=Edge cache not purged::CLOUDFLARE_API_TOKEN needs the Zone > Cache Purge > Edit permission. Until it has it, deploys that change /css/* or /js/* keep serving the old file from the edge for up to a year."
            exit 0
          fi

  preview:
    name: Preview deploy for pull requests
    # Same-repo PRs only: fork PRs have no access to repository secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Upload preview version
        # Prints a version preview URL (https://<version>-amy-electric-site.<subdomain>.workers.dev).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler versions upload --config wrangler.jsonc
